<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="turtleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shellGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d9488" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#glow)" transform="rotate(-15 50 50)">
    <!-- Head -->
    <ellipse cx="50" cy="22" rx="7" ry="9" fill="url(#turtleGrad)" />
    <circle cx="47" cy="18" r="1.5" fill="#042f2e" />
    <circle cx="53" cy="18" r="1.5" fill="#042f2e" />

    <!-- Front Left Flipper -->
    <path d="M42 36 C28 26, 14 32, 10 44 C8 50, 16 52, 28 46 C36 42, 40 40, 42 38 Z" fill="url(#turtleGrad)" />
    
    <!-- Front Right Flipper -->
    <path d="M58 36 C72 26, 86 32, 90 44 C92 50, 84 52, 72 46 C64 42, 60 40, 58 38 Z" fill="url(#turtleGrad)" />

    <!-- Rear Left Flipper -->
    <path d="M38 72 C28 78, 22 88, 26 92 C30 94, 38 88, 42 80 Z" fill="url(#turtleGrad)" />

    <!-- Rear Right Flipper -->
    <path d="M62 72 C72 78, 78 88, 74 92 C70 94, 62 88, 58 80 Z" fill="url(#turtleGrad)" />

    <!-- Little Tail -->
    <path d="M48 82 L50 90 L52 82 Z" fill="url(#turtleGrad)" />

    <!-- Main Shell (Carapace) -->
    <ellipse cx="50" cy="54" rx="22" ry="26" fill="url(#shellGrad)" stroke="#14b8a6" stroke-width="2.5" />

    <!-- Shell Scute Patterns -->
    <!-- Central Vertebral Scutes -->
    <polygon points="50,34 57,41 57,49 50,54 43,49 43,41" fill="#14b8a6" fill-opacity="0.35" stroke="#2dd4bf" stroke-width="1.2" />
    <polygon points="50,54 58,61 58,69 50,74 42,69 42,61" fill="#14b8a6" fill-opacity="0.35" stroke="#2dd4bf" stroke-width="1.2" />

    <!-- Side Costal Scutes -->
    <polygon points="43,41 33,45 33,55 43,49" fill="#0d9488" fill-opacity="0.4" stroke="#2dd4bf" stroke-width="1" />
    <polygon points="57,41 67,45 67,55 57,49" fill="#0d9488" fill-opacity="0.4" stroke="#2dd4bf" stroke-width="1" />
    <polygon points="42,61 31,64 33,74 42,69" fill="#0d9488" fill-opacity="0.4" stroke="#2dd4bf" stroke-width="1" />
    <polygon points="58,61 69,64 67,74 58,69" fill="#0d9488" fill-opacity="0.4" stroke="#2dd4bf" stroke-width="1" />

    <!-- Shell Orange/Amber Highlights matching the logo -->
    <circle cx="50" cy="44" r="2" fill="#f97316" fill-opacity="0.8" />
    <circle cx="50" cy="64" r="2" fill="#f97316" fill-opacity="0.8" />
    <circle cx="38" cy="50" r="1.5" fill="#f97316" fill-opacity="0.8" />
    <circle cx="62" cy="50" r="1.5" fill="#f97316" fill-opacity="0.8" />
  </g>
</svg>
